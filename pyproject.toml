[project]
name = "heritage-short"
version = "0.1.0"
description = "A pipeline that turns storyboard.json into a short film"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "jsonschema>=4.26.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
